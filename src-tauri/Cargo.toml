[package]
name = "docsniffer"
version = "0.3.0"
description = "DocSniffer - Enterprise file content scanning and sensitive data discovery tool"
authors = ["Security Dept"]
edition = "2021"
rust-version = "1.77"

# The single-file / green portable binary is achieved by:
#  - default `cargo build --release` (no bundler, see README)
#  - static linking is enabled via `.cargo/config.toml` (crt-static on windows)
# rlib is all the desktop app needs; avoiding staticlib/cdylib skips pointless
# DLL/static-lib links (mobile is not a target of this project).
[lib]
name = "docsniffer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Full-text indexing
tantivy = "0.22"

# File system
walkdir = "2"
dirs = "6"
notify = "7"

# Concurrency
rayon = "1"

# Content extraction
regex = "1"
chardetng = "0.1"
encoding_rs = "0.8"
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.8"

# Misc
sha2 = "0.10"
once_cell = "1"
chrono = "0.4"

# Embed default resources (default_rules.json)
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
office_oxide = "0.1.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
